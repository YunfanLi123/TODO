<script>
// 包一层 IIFE：这一段可能被多个页面各带一次，
// 而 const 重复声明会直接抛错。
(function () {
// ---------- 他们的视线 ----------
// 狄仁杰与诸葛亮看着屏幕里的人。视线向量写进 --lx / --ly，
// 整幅画只靠两个变量驱动，改一次就够。
var duo = document.getElementById('duo');
if (duo) {
  const cl = v => Math.max(-1, Math.min(1, v)).toFixed(3);
  window.addEventListener('mousemove', e => {
    const r = duo.getBoundingClientRect();
    if (!r.width || !r.height) return;
    duo.style.setProperty('--lx', cl((e.clientX - (r.left + r.width / 2)) / (r.width / 2)));
    duo.style.setProperty('--ly', cl((e.clientY - (r.top + r.height / 2)) / (r.height / 2)));
  });
}
})();
</script>
