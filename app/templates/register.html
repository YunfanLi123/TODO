<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>注册内测 · 对局之外</title>{% include "_theme_head.html" %}<link rel="stylesheet" href="{{ asset('app.css') }}"></head><body class="app-body"><main class="app-main" style="max-width:520px;padding-top:7vh"><section class="card"><h1>注册内测</h1><p class="muted">邀请码用于控制内测名额和识别服务的使用成本。</p>{% if error %}<p class="empty">{{ error }}</p>{% endif %}<form method="post" action="/auth/register"><label>昵称（可选）<input class="input" type="text" name="display_name" maxlength="80" autocomplete="nickname"></label><label>邮箱<input class="input" type="email" name="email" required autocomplete="email"></label><label>密码（至少 8 位）<input class="input" type="password" name="password" minlength="8" required autocomplete="new-password"></label><label>邀请码<input class="input" type="text" name="invite_code" required></label><p><button class="btn" type="submit">创建账号</button></p></form><p class="muted">已有账号？<a href="/auth/login">去登录</a></p></section></main>{% include "_theme_script.html" %}</body></html>
