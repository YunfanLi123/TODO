<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>登录 · 对局之外</title>{% include "_theme_head.html" %}<link rel="stylesheet" href="{{ asset('app.css') }}"></head><body class="app-body"><main class="app-main" style="max-width:520px;padding-top:9vh"><section class="card"><h1>登录内测</h1><p class="muted">登录后只能查看和管理自己的录像与复盘数据。</p>{% if error %}<p class="empty">{{ error }}</p>{% endif %}<form method="post" action="/auth/login"><label>邮箱<input class="input" type="email" name="email" required autocomplete="email"></label><label>密码<input class="input" type="password" name="password" required autocomplete="current-password"></label><p><button class="btn" type="submit">登录</button></p></form><p class="muted">还没有邀请码账号？<a href="/auth/register">注册内测</a></p></section></main>{% include "_theme_script.html" %}</body></html>
