<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>AI 复盘问答</title>{% include "_theme_head.html" %}<link rel="stylesheet" href="{{ asset('app.css') }}"></head>
<body class="app-body">{% set nav_active = "matches" %}{% include "_header.html" %}<main class="app-main"><div class="page-head"><h1>AI 复盘问答</h1><p>回答只依据本局已识别的复盘结论和训练清单，不会读取你的账号信息。</p></div><section class="card"><label for="question"><b>问这局</b></label><textarea id="question" class="input" rows="4" placeholder="例如：我第 5 分钟为什么不该去参团？下一局如何避免？"></textarea><button id="ask" class="btn" type="button">提问</button></section><section class="card" id="answerCard" hidden><h2>建议</h2><p id="answer" style="white-space:pre-wrap"></p></section><p id="notice" role="status"></p><a class="btn-ghost" href="/api/matches/{{ match_id }}/report">返回本局报告</a></main>{% include "_theme_script.html" %}<script>const q=document.getElementById('question'),n=document.getElementById('notice'),a=document.getElementById('answer'),c=document.getElementById('answerCard'),b=document.getElementById('ask');b.addEventListener('click',async()=>{b.disabled=true;n.textContent='正在结合本局复盘回答…';try{const r=await fetch('/api/matches/{{ match_id }}/qa',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({question:q.value})});let d={};try{d=await r.json()}catch(_){throw new Error(r.ok?'服务返回了无法识别的内容':'服务请求失败（HTTP '+r.status+'）')}if(!r.ok)throw new Error(d.detail||'回答失败');a.textContent=d.answer;c.hidden=false;n.textContent='';}catch(e){n.textContent=e instanceof TypeError?'无法连接本地 AI 问答服务。请刷新页面后重试；若刚更新过程序，请确认本地服务仍在运行。':e.message;}finally{b.disabled=false;}});</script></body></html>
