{# 全站共用的页内弹层。
 *
 * 确认、提醒、危险操作都用它 —— 不用浏览器的 confirm()/alert()：
 * 那是系统样式，跟产品对不上，而且只能给一行字。
 *
 * 用法（app/static/dialog.js）：
 *   askConfirm({title, text, yes, no, danger})  → Promise<boolean>
 *   askNotice({title, text, ok})                → Promise<void>
 *
 * 需要富文本正文时用 node 传一个自己建好的 DOM 节点
 * （正文默认走 textContent，对局名是用户自己起的，不能当 HTML 塞）。
 #}
<div class="dlg" id="dlg" hidden>
  <div class="dlg-card" role="dialog" aria-modal="true"
       aria-labelledby="dlgTitle" aria-describedby="dlgBody">
    <div class="dlg-title" id="dlgTitle"></div>
    <div class="dlg-body" id="dlgBody"></div>
    <div class="dlg-actions">
      <button class="btn-ghost dlg-no" id="dlgNo" type="button">再想想</button>
      <button class="dlg-yes" id="dlgYes" type="button">确认</button>
    </div>
  </div>
</div>
